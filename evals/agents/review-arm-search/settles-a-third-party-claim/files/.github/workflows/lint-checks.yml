name: Lint checks

on:
  push:
    branches:
      - main
    branches-ignore:
      - 'dependabot/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m compileall -q calc tests
